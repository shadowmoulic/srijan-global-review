<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Board Authentication | SRIJAN Journal</title>
    <link rel="icon" href="https://srijantirtha.in/wp-content/uploads/2025/10/Srijantirtha-1.png" type="image/png">
    <meta name="description"
        content="Secure Executive Board Login Portal for SRIJAN: Global Review of Arts, Science & Humanities.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="../lucide.min.js"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles.css?v=2026.1">
    <link rel="stylesheet" href="admin.css">

    <!-- Database & Auth Config -->
    <script src="../supabase-config.js"></script>

    <style>
        body.admin-login-body {
            background: linear-gradient(135deg, #0B2545 0%, #134074 50%, #1a2a3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
            font-family: var(--font-body);
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            border: 2px solid var(--accent-gold);
            padding: 2.75rem 2.25rem;
            text-align: center;
        }

        .login-brand-logo {
            width: 68px;
            height: 68px;
            background: rgba(197, 160, 89, 0.15);
            color: #C5A059;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.25rem;
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            color: var(--primary-navy);
            margin: 0 0 0.4rem 0;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
            text-align: left;
        }

        .login-form label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-navy);
        }

        .login-form input {
            padding: 0.85rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .login-form input:focus {
            border-color: var(--accent-gold);
        }

        .error-banner {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .btn-submit-login {
            padding: 0.9rem;
            font-size: 1.05rem;
            font-weight: 700;
            background-color: var(--primary-navy);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit-login:hover {
            background-color: #134074;
        }
    </style>
</head>

<body class="admin-login-body">

    <div class="login-card">
        <div class="login-brand-logo">
            <i data-lucide="shield-lock"></i>
        </div>
        <h2 class="login-title">Executive Board Authentication</h2>
        <p class="login-subtitle">Sign in securely via Supabase Auth credentials to access the Executive Console.</p>

        <div id="login-error" class="error-banner"></div>

        <!-- Supabase Auth Login Form -->
        <form id="supabase-auth-form" class="login-form">
            <div>
                <label for="input-email">Executive Email Address *</label>
                <input type="email" id="input-email" required placeholder="admin@srijantirtha.in"
                    autocomplete="username">
            </div>
            <div>
                <label for="input-password">Secure Password *</label>
                <input type="password" id="input-password" required placeholder="••••••••••••"
                    autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit-login">
                <i data-lucide="log-in"></i> Sign In to Dashboard
            </button>
        </form>

        <div style="margin-top: 2rem; font-size: 0.85rem;">
            <a href="../index.html" style="color: var(--primary-navy); text-decoration: underline; font-weight: 500;">←
                Return to Public Journal Website</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();

            // Auto-redirect if already authenticated
            const isAlreadyAuth = await SrijanAuth.verifySession();
            if (isAlreadyAuth) {
                window.location.replace('../admin-dashboard/index.html');
                return;
            }

            const formSupa = document.getElementById('supabase-auth-form');
            const errorBanner = document.getElementById('login-error');

            function showError(msg) {
                errorBanner.innerText = msg;
                errorBanner.style.display = 'block';
            }

            function hideError() {
                errorBanner.style.display = 'none';
            }

            // Supabase Auth Submission
            formSupa.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();
                const email = document.getElementById('input-email').value.trim();
                const pass = document.getElementById('input-password').value;

                if (!email || !pass) {
                    showError('Please enter both email address and password.');
                    return;
                }

                const res = await SrijanAuth.loginWithPassword(email, pass);
                if (res.success) {
                    window.location.replace('../admin-dashboard/index.html');
                } else {
                    showError(res.error || 'Invalid Supabase login credentials.');
                }
            });
        });
    </script>
</body>

</html>
